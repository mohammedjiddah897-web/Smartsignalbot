name: MojidSignalBot
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
concurrency:
  group: mojidsignalbot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Run signal bot
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          timeout 20700 uv run --with requests python -c "
          import json, os, runpy
          for raw in (os.environ['VARS_JSON'], os.environ['SECRETS_JSON']):
              for k, v in json.loads(raw).items():
                  os.environ.setdefault(k, str(v))
          runpy.run_path('signal_bot.py', run_name='__main__')
          " || true
