name: SOL bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solbot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          RUN_ONCE: "true"
          PAPER: ${{ vars.PAPER }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          LEVERAGE: ${{ vars.LEVERAGE }}
          PAPER_EQUITY: "22"
          MAIN_ADDRESS: ${{ secrets.MAIN_ADDRESS }}
          API_PRIVATE_KEY: ${{ secrets.API_PRIVATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "solbot"
          git config user.email "solbot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
